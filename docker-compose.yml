services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: envmon
      POSTGRES_USER: envmon
      POSTGRES_PASSWORD: envmon_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envmon -d envmon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: